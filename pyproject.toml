[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvicar"
version = "1.0.3"
description = "Python Shell for ViCar3D"
authors = [{ name = "Xianlin Sheng" }]
readme = "README.md"
requires-python = ">=3.8,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "trimesh",
    "pandas",
    "h5py",
    "matplotlib",
]

[project.optional-dependencies]
post = ["pyvista", "ffmpeg-python"]
mpi = ["mpi4py]

[tool.setuptools.packages.find]
where = ["src"]
